[project]
name = "kod"
version = "0.1.0"
description = "Automated layout of cylindrical cells in battery packs of light electric vehicles (grid fitting, DTAA heuristics, CLONALG)"
readme = "README.md"
authors = [
    { name = "mcvetkovic", email = "matea.cvetkovic@fer.hr" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "matplotlib>=3.11",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
